<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="50%" stop-color="#0B112C"/>
      <stop offset="100%" stop-color="#140D2B"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes orbitPulse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -100; }
    }
    @keyframes starBlink {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    .star-1 { animation: starBlink 2.5s infinite ease-in-out; }
    .star-2 { animation: starBlink 3.8s infinite ease-in-out 0.7s; }
    .star-3 { animation: starBlink 1.9s infinite ease-in-out 1.2s; }
    .orbit-line { stroke-dasharray: 8 6; animation: orbitPulse 4s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)"/>

  <!-- Grid Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="900" y1="0" x2="900" y2="400"/>
  </g>

  <!-- Animated Stars -->
  <circle cx="120" cy="80" r="2" fill="#00F2FE" class="star-1"/>
  <circle cx="280" cy="320" r="2.5" fill="#FFFFFF" class="star-2"/>
  <circle cx="450" cy="60" r="1.8" fill="#4FACFE" class="star-3"/>
  <circle cx="780" cy="90" r="2.2" fill="#00E676" class="star-1"/>
  <circle cx="950" cy="310" r="2.5" fill="#00F2FE" class="star-2"/>
  <circle cx="1100" cy="140" r="1.5" fill="#FFFFFF" class="star-3"/>

  <!-- Earth Globe Graphic -->
  <g transform="translate(600, 480)">
    <circle cx="0" cy="0" r="300" fill="#0E2340" stroke="#00F2FE" stroke-width="1.5" stroke-opacity="0.4"/>
    <circle cx="0" cy="0" r="300" fill="none" stroke="#4FACFE" stroke-width="3" stroke-opacity="0.2" filter="url(#glow)"/>
  </g>

  <!-- Orbiting Trajectories -->
  <path class="orbit-line" d="M 50 260 Q 600 40 1150 260" fill="none" stroke="#00F2FE" stroke-width="2" stroke-opacity="0.7" filter="url(#glow)"/>
  <path class="orbit-line" d="M 100 300 Q 600 120 1100 300" fill="none" stroke="#00E676" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Orbiting Satellite -->
  <g transform="translate(600, 180)" filter="url(#glow)">
    <circle cx="0" cy="0" r="6" fill="#00F2FE"/>
    <rect x="-16" y="-3" width="10" height="6" fill="#4FACFE" rx="1"/>
    <rect x="6" y="-3" width="10" height="6" fill="#4FACFE" rx="1"/>
    <circle cx="0" cy="0" r="12" fill="none" stroke="#00F2FE" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Title & Banner Text -->
  <text x="600" y="140" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#text-grad)" filter="url(#glow)">
    Awesome Space Situational Awareness 🛰️
  </text>
  <text x="600" y="195" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#E2E8F0" letter-spacing="1">
    Curated Directory of SaaS Platforms &amp; Open-Source Orbital Safety Projects
  </text>
  
  <!-- Feature Badges in Banner -->
  <g transform="translate(330, 240)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1E293B" stroke="#00F2FE" stroke-width="1"/>
    <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#00F2FE">📡 Satellite Tracking</text>
  </g>
  <g transform="translate(510, 240)">
    <rect x="0" y="0" width="180" height="32" rx="16" fill="#1E293B" stroke="#00E676" stroke-width="1"/>
    <text x="90" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#00E676">💥 Collision Avoidance</text>
  </g>
  <g transform="translate(710, 240)">
    <rect x="0" y="0" width="160" height="32" rx="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1"/>
    <text x="80" y="21" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" fill="#38BDF8">🛰️ Debris Monitoring</text>
  </g>
</svg>